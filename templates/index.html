<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد التمريضي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f3f4f6}.chat-box{max-height:70vh;overflow-y:auto;padding:1rem}.msg-user{background:#e0f2fe;border-right:4px solid #0284c7;border-radius:12px;padding:12px;margin-bottom:10px}.msg-ai{background:#f9fafb;border-right:4px solid #16a34a;border-radius:12px;padding:12px;margin-bottom:10px}</style>
</head>
<body class="h-screen flex flex-col">

<div id="loginScreen" class="flex-1 flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-right">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">🔐 تسجيل الدخول</h2>
        <form id="loginForm">
            <input type="text" id="uIn" placeholder="اسم المستخدم" required class="w-full p-3 mb-3 border rounded rtl:text-right">
            <input type="password" id="pIn" placeholder="كلمة المرور" required class="w-full p-3 mb-4 border rounded rtl:text-right">
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700 font-bold">دخول</button>
        </form>
        
        <hr class="my-4 border-gray-200">
        <button id="registerBtn" class="w-full bg-green-600 text-white p-3 rounded hover:bg-green-700 font-bold">📝 إنشاء حساب جديد</button>
        
        <p id="errMsg" class="mt-3 text-sm text-center text-red-500 hidden"></p>
    </div>
</div>

<div id="appScreen" class="hidden h-full flex">
    <aside class="w-64 bg-white border-l p-4 z-10 shadow-sm flex flex-col">
        <h1 class="text-xl font-bold text-blue-800 mb-2">🩺 المساعد</h1>
        <p class="text-sm text-gray-600 mb-6">مرحباً <span id="uName" class="font-bold"></span></p>
        
        <!-- زر الترقية للأدمن -->
        <button id="adminPromoteBtn" class="w-full bg-yellow-500 text-white p-2 rounded hover:bg-yellow-600 font-bold mb-2 hidden">⭐ ترقية حسابي لأدمن</button>

        <button onclick="logout()" class="mt-auto w-full bg-red-500 text-white p-2 rounded hover:bg-red-600">🚪 خروج</button>
    </aside>
    <main class="flex-1 flex flex-col relative bg-slate-50">
        <div id="chatBox" class="chat-box"></div>
        <form id="sendForm" class="absolute bottom-0 left-0 right-0 bg-white border-t p-4">
            <div class="flex gap-3 max-w-4xl mx-auto">
                <input id="prompt" autocomplete="off" placeholder="اكتب سؤالك هنا..." required class="flex-1 p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                <button id="btnSend" type="submit" class="bg-blue-600 text-white px-6 py-3 rounded font-bold">إرسال</button>
            </div>
        </form>
    </main>
</div>

<script>
let currentUser=null, chatHistory=[];

if(sessionStorage.getItem('nk')){
    try { currentUser=JSON.parse(sessionStorage.getItem('nk')); showApp(); initMsgs(); } catch(e) {}
}

async function checkServerStatus() {
    try { const r = await fetch('/api/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: '{}' }); return r.status === 422 || r.ok; } 
    catch(e) { alert("⚠️ لا يوجد اتصال بالخادم!"); return false; }
}

document.getElementById('loginForm').onsubmit=async(e)=>{
    e.preventDefault();
    const username = document.getElementById('uIn').value.trim().toLowerCase();
    const password = document.getElementById('pIn').value.trim();
    if(!username || !password){ document.getElementById('errMsg').innerText="يرجى ملء جميع الحقول"; return;}
    if(!await checkServerStatus()) return;

    try {
        const payload = JSON.stringify({ username: username, password: password });
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:payload});
        const d=await r.json();
        if(d.status==='success'){
            currentUser=d; sessionStorage.setItem('nk',JSON.stringify(currentUser)); showApp(); initMsgs();
        } else { document.getElementById('errMsg').textContent=d.message || "بيانات خاطئة"; }
    } catch(err) { document.getElementById('errMsg').textContent="خطأ في الاتصال."; }
};

document.getElementById('registerBtn').onclick=async()=>{
    const u=document.getElementById('uIn').value.trim().toLowerCase();
    const p=document.getElementById('pIn').value.trim();
    if(!u || !p){ alert("يرجى إدخال اسم مستخدم وكلمة سر"); return;}
    if(!await checkServerStatus()) return;
    
    try {
        const payload = JSON.stringify({ username: u, password: p, display_name: "طالب" });
        const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:payload});
        const d=await r.json();
        if(d.status==='success'){
            currentUser={status:'success', name:"طالب", username:u};
            sessionStorage.setItem('nk',JSON.stringify(currentUser)); 
            showApp(); initMsgs();
        } else { document.getElementById('errMsg').textContent="❌ " + (d.message || "حدث خطأ غير معروف"); }
    } catch(err) { document.getElementById('errMsg').textContent="فشل الطلب."; }
};

function showApp(){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('uName').innerText=currentUser.name;
    if(!currentUser.isAdmin) document.getElementById('adminPromoteBtn').classList.remove('hidden');
}

async function initMsgs(){
    try{ const r=await fetch(`/api/messages/${currentUser.username}`); if(r.ok){ chatHistory=await r.json(); chatHistory.forEach(m=>appendBubble(m.content,m.role)); } }catch(e){}
}

// ✅ تفعيل زر الترقية بدقة ومنع ظهور undefined
document.getElementById('adminPromoteBtn').onclick=async()=>{
    document.getElementById('adminPromoteBtn').disabled=true;
    document.getElementById('adminPromoteBtn').innerText="جاري إرسال طلب الصلاحيات...";
    const payload = { username: currentUser.username, prompt: "request_promotion", history: [] };
    try {
        const r=await fetch('/api/promote-to-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        let d = {}; try { d = await r.json(); } catch(e) {}
        if(d && d.status === 'success') { alert("✅ تم ترقية صلاحياتك بنجاح!"); location.reload(); } 
        else { alert("⚠️ لم يتم الترقية: " + (d.message || "تم رفض الصلاحيات.")); location.reload(); }
    } catch(err) { alert("❌ فشل الاتصال بالخادم أثناء الترقية."); location.reload(); }
};

document.getElementById('sendForm').onsubmit=async(e)=>{
    e.preventDefault();
    const inp=document.getElementById('prompt'), btn=document.getElementById('btnSend');
    const txt=inp.value.trim(); if(!txt)return;
    appendBubble(txt,'user'); inp.value=''; btn.disabled=true; btn.innerText='جاري...';
    try {
        const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,prompt:txt,history:chatHistory})});
        const d=await r.json();
        appendBubble(d.reply,'assistant');
        chatHistory.push({role:'user',content:txt},{role:'assistant',content:d.reply});
    } catch(err) { appendBubble("⚠️ عذراً، حدث خطأ في الاتصال بالمساعد الذكي.", 'assistant'); }
    btn.disabled=false; btn.innerText='إرسال';
};

function appendBubble(t,r){
    const c=document.getElementById('chatBox');
    c.innerHTML+=`<div class="${r==='user'?'msg-user':'msg-ai'}">${t}</div>`;
    c.scrollTop=c.scrollHeight;
}

function logout(){sessionStorage.removeItem('nk');location.reload();}
</script>
</body>
</html>
