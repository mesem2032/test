<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد التمريضي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f3f4f6}.chat-box{max-height:70vh;overflow-y:auto;padding:1rem}.msg-user{background:#e0f2fe;border-right:4px solid #0284c7;border-radius:12px;padding:12px;margin-bottom:10px}.msg-ai{background:#f9fafb;border-right:4px solid #16a34a;border-radius:12px;padding:12px;margin-bottom:10px}</style>
</head>
<body class="h-screen flex flex-col">

<div id="loginScreen" class="flex-1 flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-right">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">🔐 تسجيل الدخول</h2>
        <form id="loginForm">
            <input type="text" id="uIn" placeholder="اسم المستخدم" required class="w-full p-3 mb-3 border rounded rtl:text-right">
            <input type="password" id="pIn" placeholder="كلمة المرور" required class="w-full p-3 mb-4 border rounded rtl:text-right">
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700 font-bold">دخول</button>
        </form>
        <hr class="my-4 border-gray-200">
        <button id="registerBtn" class="w-full bg-green-600 text-white p-3 rounded hover:bg-green-700 font-bold">📝 إنشاء حساب جديد</button>
        <p id="errMsg" class="mt-3 text-sm text-center text-red-500 hidden"></p>
    </div>
</div>

<div id="appScreen" class="hidden h-full flex">
    <aside class="w-64 bg-white border-l p-4 z-10 shadow-sm flex flex-col">
        <h1 class="text-xl font-bold text-blue-800 mb-2">🩺 المساعد</h1>
        <p class="text-sm text-gray-600 mb-6">مرحباً <span id="uName" class="font-bold"></span></p>
        
        <button id="adminPromoteBtn" class="w-full bg-yellow-500 text-white p-2 rounded hover:bg-yellow-600 font-bold mb-2 hidden">⭐ ترقية حسابي لأدمن</button>
        <button id="adminPanelBtn" class="w-full bg-purple-600 text-white p-2 rounded hover:bg-purple-700 font-bold mb-2 hidden">🛠️ إدارة المستخدمين</button>
        <button onclick="logout()" class="mt-auto w-full bg-red-500 text-white p-2 rounded hover:bg-red-600">🚪 خروج</button>
    </aside>
    <main class="flex-1 flex flex-col relative bg-slate-50">
        <div id="chatBox" class="chat-box"></div>
        <form id="sendForm" class="absolute bottom-0 left-0 right-0 bg-white border-t p-4">
            <div class="flex gap-3 max-w-4xl mx-auto">
                <input id="prompt" autocomplete="off" placeholder="اكتب سؤالك هنا..." required class="flex-1 p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                <button id="btnSend" type="submit" class="bg-blue-600 text-white px-6 py-3 rounded font-bold">إرسال</button>
            </div>
        </form>
    </main>
</div>

<!-- نافذة الإدارة -->
<div id="adminOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-xl w-full max-w-3xl p-6 m-4 shadow-2xl max-h-[90vh] overflow-y-auto text-right">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-2xl font-bold text-purple-700">🛠️ لوحة تحكم الأدمن</h2>
            <button onclick="document.getElementById('adminOverlay').classList.add('hidden')" class="text-gray-500 hover:text-red-500 text-xl">✕</button>
        </div>

        <div id="tabs" class="flex space-x-2 space-x-reverse mb-4">
            <button onclick="switchTab('addTab')" class="tab-btn active bg-purple-100 text-purple-800 px-4 py-2 rounded font-bold">➕ إضافة</button>
            <button onclick="switchTab('listTab')" class="tab-btn bg-gray-100 px-4 py-2 rounded font-bold">📋 القائمة والحذف</button>
        </div>

        <div id="addTab" class="tab-content">
            <form id="addUserForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block mb-1 font-bold text-sm">اسم المستخدم</label><input type="text" id="newUname" required class="w-full p-2 border rounded"></div>
                <div><label class="block mb-1 font-bold text-sm">كلمة المرور</label><input type="text" id="newPword" required class="w-full p-2 border rounded"></div>
                <div><label class="block mb-1 font-bold text-sm">الاسم الظاهر</label><input type="text" id="newName" required class="w-full p-2 border rounded"></div>
                <div class="flex items-end"><button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">✅ حفظ</button></div>
            </form>
            <p id="adminMsg" class="mt-3 text-sm hidden"></p>
        </div>

        <div id="listTab" class="tab-content hidden bg-gray-50 p-4 rounded">
            <div id="usersTableContainer" class="space-y-2">جاري التحميل...</div>
        </div>
    </div>
</div>

<script>
let currentUser=null, chatHistory=[];
if(sessionStorage.getItem('nk')){ try { currentUser=JSON.parse(sessionStorage.getItem('nk')); showApp(); initMsgs(); } catch(e) {} }

async function checkServerStatus() {
    try { const r = await fetch('/api/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: '{}' }); return r.status === 422 || r.ok; } 
    catch(e) { alert("⚠️ لا يوجد اتصال!"); return false; }
}

document.getElementById('loginForm').onsubmit=async(e)=>{
    e.preventDefault();
    const username = document.getElementById('uIn').value.trim().toLowerCase();
    const password = document.getElementById('pIn').value.trim();
    if(!username || !password){ document.getElementById('errMsg').innerText="املأ الحقول"; return;}
    if(!await checkServerStatus()) return;
    try {
        const payload = JSON.stringify({ username: username, password: password });
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:payload});
        const d=await r.json();
        if(d.status==='success'){
            currentUser=d; sessionStorage.setItem('nk',JSON.stringify(currentUser)); showApp(); initMsgs();
        } else { document.getElementById('errMsg').textContent=d.message || "بيانات خاطئة"; }
    } catch(err) { document.getElementById('errMsg').textContent="خطأ."; }
};

document.getElementById('registerBtn').onclick=async()=>{
    const u=document.getElementById('uIn').value.trim().toLowerCase();
    const p=document.getElementById('pIn').value.trim();
    if(!u || !p){ alert("املأ الاسم والسر"); return;}
    if(!await checkServerStatus()) return;
    try {
        const payload = JSON.stringify({ username: u, password: p, display_name: "طالب" });
        const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:payload});
        const d=await r.json();
        if(d.status==='success'){ currentUser={status:'success', name:"طالب", username:u}; sessionStorage.setItem('nk',JSON.stringify(currentUser)); showApp(); initMsgs(); } 
        else { document.getElementById('errMsg').textContent="❌ " + d.message; }
    } catch(err) { document.getElementById('errMsg').textContent="فشل الطلب."; }
};

function showApp(){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('uName').innerText=currentUser.name;
    if(currentUser.isAdmin) {
        document.getElementById('adminPromoteBtn').classList.add('hidden');
        document.getElementById('adminPanelBtn').classList.remove('hidden');
    }
}

// ⚙️ وظائف الإدارة
async function openAdminPanel() {
    document.getElementById('adminOverlay').classList.remove('hidden');
    loadUsersList();
}

document.getElementById('adminPanelBtn').onclick = openAdminPanel;

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.getElementById(tabId).classList.remove('hidden');
}

document.getElementById('addUserForm').onsubmit = async (e) => {
    e.preventDefault();
    const u = document.getElementById('newUname').value.trim().toLowerCase();
    const p = document.getElementById('newPword').value;
    const n = document.getElementById('newName').value.trim();
    const msgEl = document.getElementById('adminMsg');
    msgEl.innerText = "جاري..."; msgEl.classList.remove('hidden', 'text-red-600', 'text-green-600', 'text-blue-600'); msgEl.classList.add('text-blue-600');

    try {
        const r = await fetch('/api/admin/users/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const d = await r.json();
        if(d.status === 'success') {
            msgEl.innerText = "✅ تمت الإضافة!"; msgEl.classList.add('text-green-600');
            e.target.reset(); loadUsersList();
        } else { msgEl.innerText = "❌ " + d.message; msgEl.classList.add('text-red-600'); }
    } catch(err) { msgEl.innerText = "فشل الاتصال."; msgEl.classList.add('text-red-600'); }
};

// ✅ دالة جلب وعرض القائمة الحقيقية
async function loadUsersList() {
    const container = document.getElementById('usersTableContainer');
    container.innerHTML = "جاري الجلب...";
    try {
        const res = await fetch('/api/admin/users/list');
        const users = await res.json();
        
        let html = "<table class='w-full text-sm text-right border-collapse'>";
        html += "<thead><tr class='bg-gray-200'><th class='p-2'>الاسم</th><th class='p-2'>الأدمن</th><th class='p-2'>الإجراءات</th></tr></thead>";
        html += "<tbody>";
        
        users.forEach(u => {
            html += `<tr class="border-b">
                <td class='p-2'>${u.name} <br><span class="text-xs text-gray-500">@${u.username}</span></td>
                <td class='p-2'>${u.is_admin ? '<span class="text-red-600 font-bold">✓</span>' : ''}</td>
                <td class='p-2'>
                    ${!u.is_admin ? `<button onclick="deleteUser('${u.username}')" class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">حذف</button>` : ''}
                </td>
            </tr>`;
        });
        html += "</tbody></table>";
        container.innerHTML = html;
    } catch(e) { container.innerHTML = "فشل جلب القائمة."; }
}

window.deleteUser = async (uname) => {
    if(confirm(`هل أنت متأكد من حذف حساب "${uname}"؟`)) {
        try {
            const r = await fetch('/api/admin/users/delete', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({username: uname, history:[]})
            });
            const d = await r.json();
            if(d.status === 'success') { loadUsersList(); alert("تم الحذف!"); }
            else { alert("فشل: " + d.message); }
        } catch(e) { alert("خطأ في الاتصال."); }
    }
};

document.getElementById('adminPromoteBtn').onclick=async()=>{
    document.getElementById('adminPromoteBtn').disabled=true;
    document.getElementById('adminPromoteBtn').innerText="جاري الطلب...";
    const payload = { username: currentUser.username, prompt: "request_promotion", history: [] };
    try {
        const r=await fetch('/api/promote-to-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        let d = {}; try { d = await r.json(); } catch(e) {}
        if(d && d.status === 'success') { alert("✅ تم ترقية صلاحياتك!"); location.reload(); } 
        else { alert("⚠️ " + (d.message || "رفض")); location.reload(); }
    } catch(err) { alert("❌ فشل الاتصال."); location.reload(); }
};

document.getElementById('sendForm').onsubmit=async(e)=>{
    e.preventDefault();
    const inp=document.getElementById('prompt'), btn=document.getElementById('btnSend');
    const txt=inp.value.trim(); if(!txt)return;
    appendBubble(txt,'user'); inp.value=''; btn.disabled=true; btn.innerText='جاري...';
    try {
        const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,prompt:txt,history:chatHistory})});
        const d=await r.json();
        appendBubble(d.reply,'assistant');
        chatHistory.push({role:'user',content:txt},{role:'assistant',content:d.reply});
    } catch(err) { appendBubble("⚠️ عذراً، حدث خطأ.", 'assistant'); }
    btn.disabled=false; btn.innerText='إرسال';
};

function appendBubble(t,r){
    const c=document.getElementById('chatBox');
    c.innerHTML+=`<div class="${r==='user'?'msg-user':'msg-ai'}">${t}</div>`;
    c.scrollTop=c.scrollHeight;
}

function logout(){sessionStorage.removeItem('nk');location.reload();}
</script>
</body>
</html>
