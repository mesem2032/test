<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد التمريضي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- إعدادات تايلوند لدعم الوضع الداكن -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* أنماط عامة */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s; }
        .chat-box { max-height: 70vh; overflow-y: auto; padding: 1rem; }
        
        /* تخصيص شريط التمرير ليكون متوافقاً مع الثيمين */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark-mode::-webkit-scrollbar-thumb { background: #4b5563; }

        /* رسائل الشات */
        .msg-user { 
            background: #dbeafe; border-right: 4px solid #2563eb; border-radius: 12px; 
            padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            transition: all 0.3s ease;
        }
        .msg-ai { 
            background: white; border-right: 4px solid #10b981; border-radius: 12px; 
            padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            transition: all 0.3s ease;
        }
    </style>
</head>

<!-- تم تعديل البودي ليضيف كلاسات إضافية عند التبديل -->
<body class="h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">

<div id="loginScreen" class="flex-1 flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-slate-800 dark:to-slate-900">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-right transform transition-all hover:scale-[1.01]">
        <div class="text-center mb-6">
            <i class="fas fa-user-nurse text-5xl text-blue-600 dark:text-blue-400 mb-2"></i>
            <h2 class="text-3xl font-bold text-slate-800 dark:text-white">تسجيل الدخول</h2>
        </div>
        <form id="loginForm">
            <input type="text" id="uIn" placeholder="اسم المستخدم" required class="w-full p-4 mb-3 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-xl rtl:text-right focus:ring-2 focus:ring-blue-500 outline-none transition">
            <input type="password" id="pIn" placeholder="كلمة المرور" required class="w-full p-4 mb-6 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-xl rtl:text-right focus:ring-2 focus:ring-blue-500 outline-none transition">
            <button type="submit" class="w-full bg-blue-600 dark:bg-blue-700 text-white p-4 rounded-xl hover:bg-blue-700 dark:hover:bg-blue-600 font-bold shadow-md transition">دخول</button>
        </form>
        <div class="absolute top-4 left-4">
             <button id="themeToggleLogin" class="p-2 rounded-full bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-yellow-300 hover:bg-gray-300 dark:hover:bg-slate-600 transition shadow-sm"><i class="fas fa-moon"></i></button>
        </div>
        <p id="errMsg" class="mt-3 text-sm text-center text-red-500 hidden"></p>
    </div>
</div>

<div id="appScreen" class="hidden h-full flex shadow-2xl overflow-hidden">
    <aside class="w-72 bg-white dark:bg-slate-800 border-l border-gray-200 dark:border-slate-700 flex flex-col z-20 shadow-lg transition-colors duration-300">
        <div class="p-6 border-b border-gray-100 dark:border-slate-700 bg-indigo-600 dark:bg-slate-900 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold mb-1"><i class="fas fa-notes-medical ml-2"></i> المساعد</h1>
                <p class="text-xs opacity-90">مرحباً بك يا <span id="uName" class="font-bold"></span></p>
            </div>
            <button id="themeToggleApp" class="p-2 rounded-full bg-indigo-500 dark:bg-slate-700 hover:bg-indigo-400 dark:hover:bg-slate-600 transition shadow-sm"><i class="fas fa-moon"></i></button>
        </div>
        <div class="p-4 flex-1 space-y-3">
            <button id="adminPromoteBtn" class="w-full bg-amber-500 dark:bg-amber-700 text-white p-3 rounded-lg hover:bg-amber-600 dark:hover:bg-amber-600 font-bold transition hidden shadow-sm"><i class="fas fa-crown ml-2"></i> طلب ترقية لأدمن</button>
            <button id="adminPanelBtn" class="w-full bg-purple-600 dark:bg-purple-800 text-white p-3 rounded-lg hover:bg-purple-700 dark:hover:bg-purple-700 font-bold transition hidden shadow-sm"><i class="fas fa-shield-alt ml-2"></i> لوحة الإدارة</button>
        </div>
        <div class="p-4 border-t border-gray-200 dark:border-slate-700">
            <button onclick="logout()" class="w-full bg-red-100 dark:bg-red-900 text-red-600 dark:text-red-200 p-3 rounded-lg hover:bg-red-200 dark:hover:bg-red-800 font-bold transition shadow-sm"><i class="fas fa-sign-out-alt ml-2"></i> خروج</button>
        </div>
    </aside>
    <main class="flex-1 flex flex-col relative bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
        <div id="chatBox" class="flex-1 p-6 space-y-4 pb-40"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700 p-6 shadow-lg transition-colors duration-300">
            <form id="sendForm" class="flex gap-3 max-w-5xl mx-auto">
                <input id="prompt" autocomplete="off" placeholder="اكتب سؤالك هنا..." required class="flex-1 p-4 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg transition">
                <button id="btnSend" type="submit" class="bg-blue-600 dark:bg-blue-700 text-white px-8 py-4 rounded-xl font-bold hover:bg-blue-700 dark:hover:bg-blue-600 transition shadow-lg"><i class="fas fa-paper-plane mr-2"></i> إرسال</button>
            </form>
        </div>
    </main>
</div>

<!-- نافذة الإدارة -->
<div id="adminOverlay" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-4xl p-8 shadow-2xl m-4 max-h-[90vh] overflow-y-auto text-right animate-fade-in-up transition-colors duration-300">
        <div class="flex justify-between items-center mb-6 border-b pb-4 border-gray-200 dark:border-slate-700">
            <h2 class="text-2xl font-bold text-indigo-800 dark:text-indigo-400"><i class="fas fa-tools ml-2"></i> لوحة تحكم الأدمن</h2>
            <button onclick="document.getElementById('adminOverlay').classList.add('hidden')" class="text-gray-400 dark:text-slate-400 hover:text-red-500 text-2xl transition">✕</button>
        </div>

        <div id="tabs" class="flex space-x-4 space-x-reverse mb-6">
            <button onclick="switchTab('addTab')" class="tab-btn active bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200 px-6 py-3 rounded-xl font-bold hover:bg-indigo-200 dark:hover:bg-indigo-800 transition">➕ إضافة مستخدم</button>
            <button onclick="switchTab('listTab')" class="tab-btn bg-gray-100 dark:bg-slate-700 px-6 py-3 rounded-xl font-bold hover:bg-gray-200 dark:hover:bg-slate-600 transition">📋 القائمة والحذف</button>
        </div>

        <div id="addTab" class="tab-content">
            <form id="addUserForm" class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-gray-50 dark:bg-slate-900 p-6 rounded-xl border border-gray-200 dark:border-slate-700 transition-colors">
                <div><label class="block mb-2 font-semibold text-slate-700 dark:text-slate-300">اسم المستخدم</label><input type="text" id="newUname" required class="w-full p-3 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg focus:ring-2 focus:ring-indigo-500"></div>
                <div><label class="block mb-2 font-semibold text-slate-700 dark:text-slate-300">كلمة المرور</label><input type="text" id="newPword" required class="w-full p-3 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg focus:ring-2 focus:ring-indigo-500"></div>
                <div><label class="block mb-2 font-semibold text-slate-700 dark:text-slate-300">الاسم الظاهر</label><input type="text" id="newName" required class="w-full p-3 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg focus:ring-2 focus:ring-indigo-500"></div>
                <div class="flex items-end"><button type="submit" class="w-full bg-emerald-600 dark:bg-emerald-700 text-white py-3 rounded-lg hover:bg-emerald-700 dark:hover:bg-emerald-600 font-bold shadow transition">✅ حفظ البيانات</button></div>
            </form>
            <p id="adminMsg" class="mt-4 text-sm font-bold hidden"></p>
        </div>

        <div id="listTab" class="tab-content hidden bg-gray-50 dark:bg-slate-900 p-6 rounded-xl border border-gray-200 dark:border-slate-700 transition-colors">
            <div id="usersTableContainer" class="space-y-4 text-sm">جاري تحميل البيانات...</div>
        </div>
    </div>
</div>

<!-- نافذة تغيير كلمة المرور -->
<div id="changePassOverlay" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-[60] backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl m-4 text-right animate-fade-in-up transition-colors duration-300">
        <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-4">تغيير كلمة المرور لـ <span id="targetUsername" class="text-indigo-600 dark:text-indigo-400"></span></h3>
        <form id="changePassForm">
            <input type="password" id="editPassInput" placeholder="كلمة المرور الجديدة" required class="w-full p-3 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg mb-4 focus:ring-2 focus:ring-indigo-500 outline-none rtl:text-right">
            <div class="flex gap-3">
                <button type="submit" class="flex-1 bg-indigo-600 dark:bg-indigo-700 text-white py-3 rounded-lg hover:bg-indigo-700 dark:hover:bg-indigo-600 font-bold shadow transition">✅ تحديث</button>
                <button type="button" onclick="closeChangePassModal()" class="flex-1 bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-gray-200 py-3 rounded-lg hover:bg-gray-300 dark:hover:bg-slate-600 font-bold shadow transition">إلغاء</button>
            </div>
        </form>
        <p id="passStatus" class="mt-3 text-sm font-bold hidden"></p>
    </div>
</div>

<script>
let currentUser=null, chatHistory=[];
if(sessionStorage.getItem('nk')){ try { currentUser=JSON.parse(sessionStorage.getItem('nk')); showApp(); initMsgs(); } catch(e) {} }

// ⚙️ إدارة الوضع الداكن
const themeToggles = document.querySelectorAll('#themeToggleLogin, #themeToggleApp');
const savedTheme = localStorage.getItem('theme');

// التحقق مما إذا كان النظام يدعم الداكن تلقائياً
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
    document.documentElement.classList.add('dark');
    updateIcons(true);
    applyChatStyles('dark');
}

themeToggles.forEach(btn => btn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateIcons(isDark);
    if(isDark) applyChatStyles('dark'); else applyChatStyles('light');
}));

function updateIcons(isDark) {
    themeToggles.forEach(btn => {
        btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });
}

// دالة لتغيير ألوان الرسائل مباشرة عند التبديل
function applyChatStyles(theme) {
    // تحديث الرسائل الحالية لتتناسب مع الثيم الجديد فوراً
    document.querySelectorAll('.msg-user').forEach(el => {
        if(theme === 'dark') {
            el.style.background = '#312e81'; el.style.borderColor = '#4f46e5';
        } else {
            el.style.background = ''; el.style.borderColor = '';
        }
    });
}

async function checkServerStatus() { try { const r = await fetch('/api/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: '{}' }); return r.status === 422 || r.ok; } catch(e) { return false; } }

document.getElementById('loginForm').onsubmit=async(e)=>{
    e.preventDefault();
    const username = document.getElementById('uIn').value.trim().toLowerCase();
    const password = document.getElementById('pIn').value.trim();
    if(!username || !password){ document.getElementById('errMsg').innerText="يرجى ملء جميع الحقول"; return;}
    if(!await checkServerStatus()) return;
    try {
        const payload = JSON.stringify({ username: username, password: password });
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:payload});
        const d=await r.json();
        if(d.status==='success'){
            currentUser=d; sessionStorage.setItem('nk',JSON.stringify(currentUser)); showApp(); initMsgs();
        } else { document.getElementById('errMsg').textContent=d.message || "بيانات خاطئة"; }
    } catch(err) { document.getElementById('errMsg').textContent="خطأ في الاتصال."; }
};

function showApp(){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('uName').innerText=currentUser.name;
    if(currentUser.isAdmin) {
        document.getElementById('adminPromoteBtn').classList.add('hidden');
        document.getElementById('adminPanelBtn').classList.remove('hidden');
    }
}

async function openAdminPanel() {
    document.getElementById('adminOverlay').classList.remove('hidden');
    loadUsersList();
}

document.getElementById('adminPanelBtn').onclick = openAdminPanel;

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.getElementById(tabId).classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'bg-indigo-100', 'text-indigo-800', 'dark:bg-indigo-900', 'dark:text-indigo-200'));
    event.target.classList.add('active', 'bg-indigo-100', 'text-indigo-800', 'dark:bg-indigo-900', 'dark:text-indigo-200');
}

document.getElementById('addUserForm').onsubmit = async (e) => {
    e.preventDefault();
    const u = document.getElementById('newUname').value.trim().toLowerCase();
    const p = document.getElementById('newPword').value;
    const n = document.getElementById('newName').value.trim();
    const msgEl = document.getElementById('adminMsg');
    msgEl.innerText = "جاري..."; msgEl.className = "mt-4 text-sm font-bold block text-blue-600 dark:text-blue-400";

    try {
        const r = await fetch('/api/admin/users/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p, display_name: n })
        });
        const d = await r.json();
        if(d.status === 'success') {
            msgEl.innerText = "✅ تمت الإضافة بنجاح!"; msgEl.className = "mt-4 text-sm font-bold block text-green-600 dark:text-green-400";
            e.target.reset(); loadUsersList();
        } else { msgEl.innerText = "❌ " + d.message; msgEl.className = "mt-4 text-sm font-bold block text-red-600 dark:text-red-400"; }
    } catch(err) { msgEl.innerText = "فشل الاتصال بالخادم."; msgEl.className = "mt-4 text-sm font-bold block text-red-600 dark:text-red-400"; }
};

window.openChangePassModal = (uname) => {
    document.getElementById('targetUsername').innerText = uname;
    document.getElementById('editPassInput').value = '';
    document.getElementById('changePassOverlay').classList.remove('hidden');
};

document.getElementById('changePassForm').onsubmit = async (e) => {
    e.preventDefault();
    const uname = document.getElementById('targetUsername').innerText;
    const npass = document.getElementById('editPassInput').value;
    const statusEl = document.getElementById('passStatus');
    statusEl.innerText = "جاري التحديث..."; statusEl.classList.remove('hidden', 'text-red-600', 'text-green-600', 'dark:text-green-400', 'dark:text-red-400'); statusEl.classList.add('text-blue-600', 'dark:text-blue-400');

    try {
        const r = await fetch('/api/admin/users/update-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: uname, new_password: npass })
        });
        const d = await r.json();
        if(d.status === 'success') {
            statusEl.innerText = "✅ تم تحديث كلمة المرور بنجاح!"; statusEl.classList.add('text-green-600', 'dark:text-green-400');
            setTimeout(() => closeChangePassModal(), 1500);
        } else {
            statusEl.innerText = "❌ " + d.message; statusEl.classList.add('text-red-600', 'dark:text-red-400');
        }
    } catch(err) { statusEl.innerText = "فشل الاتصال."; statusEl.classList.add('text-red-600', 'dark:text-red-400'); }
};

function closeChangePassModal() {
    document.getElementById('changePassOverlay').classList.add('hidden');
    document.getElementById('passStatus').classList.add('hidden');
}

async function loadUsersList() {
    const container = document.getElementById('usersTableContainer');
    container.innerHTML = "<div class='flex justify-center'><i class='fas fa-spinner fa-spin text-2xl'></i></div>";
    try {
        const res = await fetch('/api/admin/users/list');
        const users = await res.json();
        
        let html = "<table class='w-full text-sm text-right border-collapse bg-white dark:bg-slate-800 shadow rounded-lg overflow-hidden transition-colors'>";
        html += "<thead><tr class='bg-gray-100 dark:bg-slate-700'><th class='p-4 font-semibold'>الاسم الظاهر</th><th class='p-4 font-semibold'>الأدمن</th><th class='p-4 font-semibold'>الإجراءات</th></tr></thead>";
        html += "<tbody>";
        
        users.forEach(u => {
            html += `<tr class="border-b hover:bg-gray-50 dark:hover:bg-slate-700 transition">
                <td class='p-4 font-medium text-slate-700 dark:text-slate-200'>${u.name} <br><span class="text-xs text-gray-500 font-normal">@${u.username}</span></td>
                <td class='p-4'>${u.is_admin ? '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold">✓ نعم</span>' : ''}</td>
                <td class='p-4'>
                    <button onclick="openChangePassModal('${u.username}')" class="bg-blue-500 dark:bg-blue-700 text-white px-3 py-1.5 rounded hover:bg-blue-600 dark:hover:bg-blue-600 shadow-sm transition ml-2"><i class="fas fa-key ml-1"></i> تغيير كلمة السر</button>
                    <button onclick="deleteUser('${u.username}')" class="bg-red-500 dark:bg-red-700 text-white px-3 py-1.5 rounded hover:bg-red-600 dark:hover:bg-red-600 shadow-sm transition"><i class="fas fa-trash-alt ml-1"></i> حذف</button>
                </td>
            </tr>`;
        });
        html += "</tbody></table>";
        container.innerHTML = html;
    } catch(e) { container.innerHTML = "<p class='text-red-500 text-center'>فشل جلب القائمة.</p>"; }
}

window.deleteUser = async (uname) => {
    if(confirm(`هل أنت متأكد من حذف "${uname}" نهائياً؟`)) {
        try {
            const r = await fetch('/api/admin/users/delete', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({username: uname})
            });
            if (!r.ok) {
                const errText = await r.text();
                throw new Error(`خطأ الخادم (${r.status}): ${errText}`);
            }
            const d = await r.json();
            if(d.status === 'success') { loadUsersList(); alert("تم الحذف بنجاح!"); }
            else { alert("فشل: " + d.message); }
        } catch(e) { alert("⚠️ فشل العملية: " + e.message); }
    }
};

document.getElementById('adminPromoteBtn').onclick=async()=>{
    document.getElementById('adminPromoteBtn').disabled=true;
    document.getElementById('adminPromoteBtn').innerText="جاري الطلب...";
    const payload = { username: currentUser.username, prompt: "request_promotion", history: [] };
    try {
        const r=await fetch('/api/promote-to-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        let d = {}; try { d = await r.json(); } catch(e) {}
        if(d && d.status === 'success') { alert("✅ تم ترقية صلاحياتك!"); location.reload(); } 
        else { alert("⚠️ " + (d.message || "رفض")); location.reload(); }
    } catch(err) { alert("❌ فشل الاتصال."); location.reload(); }
};

document.getElementById('sendForm').onsubmit=async(e)=>{
    e.preventDefault();
    const inp=document.getElementById('prompt'), btn=document.getElementById('btnSend');
    const txt=inp.value.trim(); if(!txt)return;
    appendBubble(txt,'user'); inp.value=''; btn.disabled=true; btn.innerText='جاري البحث...';
    try {
        const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,prompt:txt,history:chatHistory})});
        const d=await r.json();
        appendBubble(d.reply,'assistant');
        chatHistory.push({role:'user',content:txt},{role:'assistant',content:d.reply});
    } catch(err) { appendBubble("⚠️ عذراً، حدث خطأ.", 'assistant'); }
    btn.disabled=false; btn.innerText='إرسال';
};

function appendBubble(t,r){
    const c=document.getElementById('chatBox');
    c.innerHTML+=`<div class="${r==='user'?'msg-user':'msg-ai'}">${t}</div>`;
    c.scrollTop=c.scrollHeight;
}

function logout(){sessionStorage.removeItem('nk');location.reload();}
</script>
</body>
</html>
